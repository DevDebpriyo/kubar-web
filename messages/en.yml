# ── About page ────────────────────────────────────────────────
about:
  page_title: "About Us"
  page_description: "Meet the team building credit infrastructure for India's future"
  
  mission_section:
    subtitle: "Our Mission"
    intro: "Kubar Labs was born out of a simple truth. Small businesses move India forward, but the system that should support them often holds them back."
    message: "We're here to change that."
    description: "At Kubar Labs, we're building the digital foundation that connects lenders and small businesses through trust, data, and understanding. We want every business owner, no matter where they are or what they make, to have fair access to credit when they need it most."
  
  story_section:
    badge: "01"
    title: "How It All Started"
    subtitle: "It started with one question."
    question: "Why is getting a loan still so hard for India's small businesses?"
    description: "We met entrepreneurs with real orders and clean records, still waiting months for approval. We met lenders who wanted to lend, but couldn't see the full picture. Data was scattered. Trust was missing."
    insight: "That gap became our mission."
    closing: "We built NavDhan to bridge MSMEs and lenders using verified data and intelligent systems. Kubar Labs was born to bring empathy back into finance."
  
  vision_section:
    badge: "02"
    title: "Our Vision"
    subtitle: "We want credit to move where business happens."
    description: "Kubar Labs builds systems that help lenders understand MSMEs better, and help MSMEs access credit without friction. We remove complexity, delay, and guesswork from lending."
    goal: "Our goal is a fairer financial system where small businesses are judged by their strength, not their size."
  
  team_section:
    badge: "03"
    title: "Meet the Team"
    subtitle: "We are builders who believe in small businesses."
    description: "We have sat with MSMEs, accountants, and lenders to understand the real problems on the ground. We know how one loan can change a business."
    closing: "That understanding drives everything we build at Kubar Labs."
  
  closing_section:
    title: "The Future of Finance"
    message: "The future of finance will be built in small factories, shops, and workshops across India. If we can make credit flow to them easily, fairly, and transparently, we can reshape the story of growth in this country."
    final: "That's what we're here for."
    brand: "That's what Kubar Labs stands for."
  
  cta_section:
    title: "Join our mission"
    description: "Be part of a movement reshaping credit in India."
    button: "Get in Touch"
    button_email: "partnerships@kubar.tech"

# ── NavDhan Product Page ──────────────────────────────────────
navdhan:
  page_title: "NavDhan - Smart Credit Infrastructure for India's MSMEs"
  page_description: "NavDhan by Kubar Labs powers embedded lending for the next generation of MSME finance."
  
  hero:
    title: "Smart Credit Infrastructure for India's MSMEs"
    description: "NavDhan by Kubar Labs powers embedded lending for the next generation of MSME finance. It connects lenders, marketplaces, and business platforms in one place to make credit flow where business actually happens."
    cta_primary: "Book a Demo"
  
  problem_section:
    eyebrow: "The Challenge"
    subtitle: "Making credit available at the right time."
    problem_text: "Thousands of businesses in India struggle to secure loans while working capital gradually disappears into receivables. At the same time, banks and NBFCs struggle to find the right borrowers spending months verifying data and chasing documentation."
    solution_text: "NavDhan makes MSME lending faster, smarter, and deeply embedded. It bridges this gap, connecting lenders and businesses through live, verified transaction data at the exact point of need."
  
  use_cases:
    title: "Use Cases"
    cases:
      1:
        title: "Cash-Flow Loans"
        description: "Disburse working capital in hours using live transaction data, verified GST filings, and Account Aggregator feeds to give lenders a 360° view of every business they finance."
      2:
        title: "Faster, Smarter, Embedded Lending"
        description: "Automate GST and e-invoice validation to finance MSME receivables and reduce underwriting friction."
      3:
        title: "Checkout Financing"
        description: "Enables lenders to assess, approve, and service MSME loans directly through the platforms where businesses already operate, like marketplaces, ERPs, supplier apps, or payment systems."
  
  why_works:
    title: "Why NavDhan Works"
    tagline: "Traditional credit models rely on paperwork and assumptions. We rely on proof."
    message: "NavDhan uses real-time signals from business operations to assess creditworthiness more accurately than any static report."
    features:
      1: "Unified validation from GST, Account Aggregator, and marketplace sources"
      2: "Sector-specific scoring models built for manufacturing, trading, and services"
      3: "Embedded disbursal flows through eNACH, UPI, and DLT-powered smart contracts"
      4: "Continuous monitoring for better risk visibility and healthier portfolios"
  
  integrations:
    title: "Integrations at Every Layer"
    subtitle: "Integrated at every layer of the financial stack. NavDhan connects seamlessly with:"
    marketplace_partners:
      label: "Marketplace & ERP Partners"
      items:
        1: "ONDC trade channels"
        2: "Top B2B procurement platforms"
        3: "Inventory & receivable systems"
    lender_systems:
      label: "Lender Systems"
      items:
        1: "Core banking & CBS"
        2: "LOS/LMS orchestration"
        3: "CRM and compliance suites"
    data_infra:
      label: "Data Infrastructure"
      items:
        1: "Account Aggregator (AA)"
        2: "GSTN & e-invoice rails"
        3: "UPI & cash-flow telemetry"
  
  for_banks:
    title: "NavDhan for Banks and NBFCs"
    subtitle: "A better way to reach, assess, and serve MSME borrowers. Meet MSMEs exactly where business happens with verified, structured business data."
    features:
      1: "Real-time underwriting - Using live transaction data"
      2: "Embedded loan offers - At the point of purchase or sale"
      3: "Faster disbursals - With digital KYC and LOS/LMS automation"
      4: "Rich portfolio insights - Powered by sectoral intelligence"
    tagline: "We help you move from reactive lending to data-driven, relationship-first MSME financing."
    cta: "Schedule a Partner Briefing"
    cta_email: "partnerships@kubar.tech"
  
  for_msmes:
    title: "NavDhan for MSMEs"
    subtitle: "Get the right loan at the right time, automatically. NavDhan works behind the scenes to match you with lenders that trust your data. No brokers, no endless forms."
    features:
      1: "Automatic loan matching - Loan offers that match your business needs and cash flow cycles. No brokers, no endless forms."
      2: "Focus on growth - Faster access to credit means you can focus on growth instead of waiting for payments."
    cta_primary: "Join Our Whatsapp Community"
    cta_secondary: "Join the Waitlist"

